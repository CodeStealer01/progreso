<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Progreso">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Progreso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: silencio, un solo objeto por pantalla
   IDEA: anillo de actividad a tamaño completo, como una esfera de reloj
   PICTURE: el anillo con su símbolo, centrado, nada más
   COLOUR and TYPE: negro/blanco puro, un color por tarea; Manrope solo en la hoja de edición
   LAYOUT: carrusel horizontal a pantalla completa, una tarea por página */
:root{color-scheme:dark;--bg:light-dark(#ffffff,#000000);--card:light-dark(#f4f4f6,#141418);--ink:light-dark(#0c0c10,#f4f4f7);--mute:light-dark(#6b6b78,#8c8c99);--track:light-dark(#ececf0,#1c1c22);--line:light-dark(#e3e3ea,#25252e)}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Manrope,system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pager{position:relative;height:100dvh;overflow:hidden;touch-action:none}
.page{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);display:grid;place-items:center;will-change:transform,opacity;transform-origin:50% 50%;contain:layout style;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.page{--s:min(80vw,64dvh,560px)}
.ringbtn{all:unset;cursor:pointer;position:relative;width:var(--s);animation:bob 6s ease-in-out infinite;animation-delay:var(--d,0s);aspect-ratio:1;display:grid;place-items:center;border-radius:50%;transition:transform .15s}
.ringbtn:active{transform:scale(.97)}
.moving .ringbtn:active{transform:none}
.moving .ringbtn,.moving .page::after{animation-play-state:paused}
.moving .page{pointer-events:none}
.ringbtn:focus-visible{outline:2px solid var(--c);outline-offset:10px}
.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring .tr{stroke:var(--track)}
.ring .pr{stroke:var(--c);transition:stroke-dashoffset .7s cubic-bezier(.22,1,.36,1)}
.done .ring .pr{filter:drop-shadow(0 0 8px var(--c));transition:stroke-dashoffset .7s cubic-bezier(.22,1,.36,1),filter .3s}
.moving .done .ring .pr{filter:none}
.ico{width:34%;height:34%;color:var(--c);transition:transform .25s}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -10px}}
@keyframes shade{0%,100%{transform:translateX(-50%) scale(1);opacity:.55}50%{transform:translateX(-50%) scale(.82);opacity:.3}}
.page::after{content:'';position:absolute;left:50%;top:calc(100% + 22px);width:calc(var(--s)*.55);height:calc(var(--s)*.06);border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 45%,transparent),transparent);transform:translateX(-50%);animation:shade 6s ease-in-out infinite;animation-delay:var(--d,0s);pointer-events:none}
.ico svg,.sheet svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.pulse .ico{transform:scale(1.08)}
.label{position:absolute;top:61%;left:10%;right:10%;text-align:center;font:800 clamp(18px,5.5vw,26px)/1.2 Manrope,system-ui,sans-serif;color:var(--c);opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s;pointer-events:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.showname .label{opacity:1;transform:none}
.showname .ico{transform:translateY(-16%) scale(.9)}
.menu{position:absolute;left:50%;top:calc(50% + var(--s)*.285);display:flex;gap:8px;transform:translate(-50%,8px);opacity:0;pointer-events:none;transition:opacity .3s cubic-bezier(.22,1,.36,1),transform .3s cubic-bezier(.22,1,.36,1);z-index:2}
.menuon .menu{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.menu button{height:40px;padding:0 16px;border:0;border-radius:20px;background:var(--track);color:var(--ink);font:800 14px Manrope,system-ui,sans-serif;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.menu .mdel{color:#e5484d}
.menu button[data-m=minus]{min-width:52px;font-size:16px}.menu .mdel.arm{background:#e5484d;color:#fff}
.menuon .ringbtn{animation-play-state:paused}
.float{position:fixed;z-index:5;pointer-events:none;font:800 20px/1 Manrope,system-ui,sans-serif;color:var(--c);white-space:nowrap;transform:translate(-50%,-50%);animation:flo .9s ease-out forwards}
@keyframes flo{0%{opacity:0;transform:translate(-50%,-50%) scale(.85)}15%{opacity:1;transform:translate(-50%,-70%) scale(1)}100%{opacity:0;transform:translate(-50%,-180%)}}
.new .ring .tr{stroke-dasharray:0 4.6}
.new{--c:var(--mute)}
/* hoja inferior (mantén pulsado el anillo) */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--card);border-radius:26px 26px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(105%);transition:transform .3s cubic-bezier(.3,.8,.3,1);max-height:88dvh;overflow-y:auto;-webkit-user-select:text;user-select:text}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sheet h2{font-size:22px;margin:0;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pct{font-size:22px;font-weight:800;color:var(--pick);white-space:nowrap}
.step{display:flex;align-items:center;gap:10px;margin-top:14px}
.step button{width:52px;height:52px;border-radius:16px;border:0;background:var(--track);color:var(--ink);font:800 24px/1 Manrope,system-ui,sans-serif;cursor:pointer}
.step span{flex:1;text-align:center;font-weight:800;font-size:18px;white-space:nowrap}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:14px 0 6px}
input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 16px Manrope,system-ui,sans-serif;padding:0 12px}
input:focus{outline:2px solid var(--pick);outline-offset:1px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.icons{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.icons button{aspect-ratio:1;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:22%}
.icons button.sel{border:2px solid var(--pick);color:var(--pick)}
.colors{display:flex;flex-wrap:wrap;gap:10px}
.colors button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;background:var(--sw);padding:0}
.colors button.sel{border-color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.actions button{flex:1 1 40%;height:48px;border-radius:14px;border:0;font:800 15px Manrope,system-ui,sans-serif;cursor:pointer;background:var(--track);color:var(--ink)}
.actions .save{background:var(--ink);color:var(--bg);flex-basis:100%}
.label small{display:block;font-size:.62em;font-weight:700;color:var(--mute);margin-top:4px}
.hintS{font-weight:600;color:var(--mute);font-size:12px}
.sr2{display:grid;grid-template-columns:28px minmax(0,1fr) auto 36px 36px 28px;align-items:center;gap:6px;margin-bottom:6px}
.sr2 .act{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:none;padding:0;cursor:pointer}
.sr2 .act.on{border-color:var(--pick);background:var(--pick)}
.sr2 .sn{height:38px;font-size:15px}
.sr2 .sc{font-size:13px;font-weight:700;color:var(--mute);white-space:nowrap;min-width:44px;text-align:right}
.sr2 button[data-a=inc],.sr2 button[data-a=dec]{height:36px;border:0;border-radius:10px;background:var(--track);color:var(--ink);font:800 18px Manrope,system-ui,sans-serif;cursor:pointer}
.sr2 .rm{border:0;background:none;color:var(--mute);font-size:18px;cursor:pointer}
.addS{margin-top:4px;height:40px;width:100%;border:1px dashed var(--line);border-radius:12px;background:none;color:var(--ink);font:700 14px Manrope,system-ui,sans-serif;cursor:pointer}
.hint{color:var(--mute);text-align:center;font-size:15px;line-height:1.5;padding:24px 12px}.hint b{color:var(--ink)}
.actions .del{color:#e5484d}
.actions .del.arm{background:#e5484d;color:#fff}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){.ringbtn,.page::after{animation:none}.ring .pr,.sheet,.scrim,.ico,.ringbtn,.label{transition:none}.float{animation-duration:.5s}}

/* grupos y vista semana */
.stage{position:fixed;inset:0;touch-action:none}
.gname{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 18px);text-align:center;font-weight:800;font-size:15px;color:var(--mute);opacity:0;transition:opacity .5s cubic-bezier(.22,1,.36,1);pointer-events:none;letter-spacing:.01em}
.gname.on{opacity:1}
.summary{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 50px) 20px 0}
.big{position:relative;width:min(52vw,28dvh,280px);aspect-ratio:1;display:grid;place-items:center;flex:none;--c:var(--ink)}
.big .ring circle{stroke-width:6}
.big .num{text-align:center;line-height:1}
.big .num b{display:block;font-size:clamp(40px,12vw,64px);font-weight:800;letter-spacing:-.03em}
.big .num span{display:block;font-size:14px;line-height:1.35;color:var(--mute);font-weight:600}
.weeks{display:flex;gap:clamp(4px,1.6vw,10px);margin-top:20px;flex:none;width:100%;max-width:520px;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:2px 22px;scroll-padding-inline:22px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
.weeks::-webkit-scrollbar{display:none}.wk{flex:none;scroll-snap-align:end}.wk:first-child{margin-left:auto}.wk:last-child{margin-right:auto}
.wk{display:flex;flex-direction:column;align-items:center;gap:4px;--c:var(--mute)}
.wk .mini{width:30px;height:30px}.wk .mini .ring circle{stroke-width:11}
.wk span{font-size:11px;color:var(--mute);font-weight:600;white-space:nowrap}
.wk{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 2px;border-radius:12px;flex:none;scroll-snap-align:end;transition:background .25s}
.wk:focus-visible{outline:2px solid var(--ink)}
.wk small{font-size:10px;line-height:1.1;color:var(--mute);white-space:nowrap;margin-top:-2px}
.wk.full{--c:var(--ink)}.wk.sel{background:var(--track)}.wk.sel span{color:var(--ink);font-weight:800}
.big .num em{display:block;font-style:normal;font-size:12px;font-weight:700;color:var(--mute);margin-top:8px;text-decoration:underline;text-underline-offset:3px}
.list{width:100%;max-width:520px;flex:1;overflow-y:auto;touch-action:pan-y;margin-top:22px;padding-bottom:calc(env(safe-area-inset-bottom) + 24px);-webkit-overflow-scrolling:touch}
.gh,.srow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px}
.gh{color:var(--mute);font-size:13px;font-weight:600;margin:16px 0 6px}
.gh .dl{display:flex;gap:6px}.gh .dl i{width:12px;text-align:center;font-style:normal;font-size:11px}
.srow{padding:8px 0}
.mini{position:relative;width:44px;height:44px;display:grid;place-items:center}
.mini .ring circle{stroke-width:9}
.mini .ico{width:46%;height:46%}
.srow .nm{font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .ct{font-size:13px;line-height:1.3;color:var(--mute);overflow-wrap:anywhere;margin-top:2px}
.srow>div:nth-child(2){overflow:hidden}
.dots{flex:none}
@media(max-width:420px){.dots,.gh .dl{gap:5px}.dots i,.gh .dl i{width:11px}.dots i{height:11px}.gh,.srow{column-gap:10px}}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--track)}
.dots i.on{background:var(--c)}
.dots i.today{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--mute)}
.seg{display:flex;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{flex:1;height:38px;border:0;border-radius:9px;background:none;color:var(--ink);font:700 14px Manrope,system-ui,sans-serif;cursor:pointer}
.seg button.sel{background:var(--pick);color:#fff}
.chk{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px;font-weight:600;color:var(--ink)}
.chk input{width:22px;height:22px;accent-color:var(--pick)}
.shake{animation:shk .35s}
@keyframes shk{20%,60%{translate:-6px 0}40%,80%{translate:6px 0}}
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="pager" id="pager"></div>
  <section class="summary" id="summary" hidden></section>
</main>
<div class="gname" id="gname"></div>

<div class="scrim" id="scrim"></div>
<form class="sheet" id="sheet" autocomplete="off">
  <div class="grab"></div>
  <div class="head"><h2 id="stitle">Nueva rueda</h2><span class="pct" id="spct"></span></div>
  <div class="step" id="step"><button type="button" id="minus" aria-label="Restar">−</button><span id="scount"></span><button type="button" id="plus" aria-label="Sumar">+</button></div>
  <label for="fName">Nombre</label>
  <input id="fName" maxlength="28" placeholder="Cálculo">
  <label for="fGroup">Grupo</label>
  <input id="fGroup" maxlength="24" list="groupList" placeholder="Asignaturas">
  <datalist id="groupList"></datalist>
  <div class="row">
    <div id="goalBox"><label for="fGoal">Objetivo</label><input id="fGoal" type="number" inputmode="numeric" min="1" max="9999" value="10"></div>
    <div><label for="fUnit">Unidad</label><input id="fUnit" maxlength="14" placeholder="apartados"></div>
  </div>
  <label>Se reinicia</label>
  <div class="seg" id="fPeriod"><button type="button" data-p="dia">Cada día</button><button type="button" data-p="semana">Cada semana</button><button type="button" data-p="total">Nunca</button></div>
  <label class="chk"><input type="checkbox" id="fOnce"> Máximo una vez al día</label>
  <div id="sessBox">
    <label>Sesiones <span class="hintS">· toca el punto para elegir la sesión activa</span></label>
    <div id="fSess"></div>
    <button type="button" id="addSess" class="addS">+ Añadir sesión</button>
  </div>
  <label>Símbolo</label>
  <div class="icons" id="fIcons"></div>
  <label>Color</label>
  <div class="colors" id="fColors"></div>
  <div class="actions">
    <button type="submit" class="save">Guardar</button>
    <button type="button" id="reset">Poner a 0</button>
    <button type="button" class="del" id="del">Eliminar</button>
  </div>
</form>

<script>
{
const ICONS={
  pesa:'<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>',
  calculo:'<path d="M15 3.5c-1.8 0-2.4 1.3-2.8 3.5l-1.9 10c-.4 2.2-1 3.5-2.8 3.5"/><path d="M15.5 12.5l4 4M19.5 12.5l-4 4"/>',
  estudio:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/>',
  libro:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>',
  codigo:'<path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/>',
  chip:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
  atomo:'<circle cx="12" cy="12" r="1.5"/><ellipse cx="12" cy="12" rx="10" ry="4"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/>',
  pastilla:'<g transform="rotate(45 12 12)"><rect x="8" y="3" width="8" height="18" rx="4"/><path d="M8 12h8"/></g>',
  agua:'<path d="M12 3c-3 4-6 7.5-6 11a6 6 0 0 0 12 0c0-3.5-3-7-6-11z"/>',
  correr:'<circle cx="14" cy="4.5" r="1.8"/><path d="M6 21l3-5 3 2 1-6 4 3h3M9 11l3-3 3 1"/>',
  corazon:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',
  musica:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
  dinero:'<path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
  luna:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  estrella:'<path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/>',
  idioma:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.5 5.5 3.5 9s-1 6.5-3.5 9c-2.5-2.5-3.5-5.5-3.5-9s1-6.5 3.5-9z"/>',
  check:'<path d="M5 12l5 5L20 7"/>',
  plus:'<path d="M12 5v14M5 12h14"/>'
};
const PICKABLE=Object.keys(ICONS).filter(k=>k!=='plus');
const COLORS=['#ff375f','#ff9f0a','#ffd60a','#30d158','#64d2ff','#0a84ff','#bf5af2','#ff6482'];
const KEY='progreso.datos',VKEY='progreso.view';
const svg=(n)=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||ICONS.estrella}</svg>`;
const R=46,C=2*Math.PI*R;
const $=(id)=>document.getElementById(id);
const stage=$('stage'),pager=$('pager'),summary=$('summary');
const esc=(s)=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const off=(p)=>C*(1-p/100);

/* ===== fechas ===== */
const DAY=864e5;
const dayStart=(d=new Date())=>new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
const monday=()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};
const periodStart=(t)=>t.period==='dia'?dayStart():t.period==='semana'?monday():0;

/* ===== datos ===== */
let tasks=null;
try{tasks=JSON.parse(localStorage.getItem(KEY))}catch(e){}
/* actividades predeterminadas (solo la primera vez que se abre la app) */
if(!Array.isArray(tasks))tasks=[
  {id:1,name:'Gimnasio',icon:'pesa',color:'#ff375f',goal:1,unit:'sesión',group:'Hábitos',period:'dia',once:true,log:[]},
  {id:2,name:'Creatina',icon:'pastilla',color:'#64d2ff',goal:1,unit:'toma',group:'Hábitos',period:'dia',once:true,log:[]}
];
/* semana 1 = la semana en que se empezó a usar la app */
const SKEY='progreso.inicio';
let START=null;try{START=+localStorage.getItem(SKEY)||null}catch(e){}
if(!START){START=monday();try{localStorage.setItem(SKEY,START)}catch(e){}}
const relWeek=(m)=>Math.round((m-START)/(7*DAY))+1;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}};
/* asignaturas: un grupo por asignatura y una rueda por sesión (se aplica una sola vez).
   Si existían las ruedas combinadas anteriores, sus apartados marcados pasan a la rueda de su sesión. */
try{
  if(!localStorage.getItem('progreso.asig2')){
    const SUBJ=[
      ['Cálculo Teoría','calculo','#0a84ff',[['Límites',10],['Derivadas',29]]],
      ['Cálculo Práctica','calculo','#64d2ff',[['Sesión 5',4],['Sesión 6',12],['Sesión 7',6],['Sesión 8',4],['Sesión 9',20]]],
      ['FS Teoría','chip','#bf5af2',[['Tema 3',16],['Problemas',1]]],

const addDays=(t,n)=>{const d=new Date(t);d.setDate(d.getDate()+n);return d.getTime()};

  const w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/DAY-3+((w1.getDay()+6)%7))/7)}
function weekPctFor(m){
  const cur=m===monday(),days=cur?Math.round((dayStart()-m)/DAY)+1:7;
  const ws=tasks.filter(t=>t.period!=='total');
  if(!ws.length)return cur&&tasks.length?Math.round(tasks.reduce((a,t)=>a+pct(t),0)/tasks.length):0;
  const vals=ws.map(t=>{
    if(t.period==='semana')return Math.min(1,inRange(t,m,addDays(m,7))/t.goal)*100;
    let s=0;for(let i=0;i<days;i++){const a=addDays(m,i);s+=Math.min(1,inRange(t,a,addDays(a,1))/t.goal)}

const weekPct=()=>weekPctFor(monday());

  let n=done(0)?1:0;for(let k=1;k<104&&done(k);k++)n++;return n;

/* estadísticas de una rueda en una semana concreta (k = semanas atrás) */
function weekStat(t,k){
  const m=mondayAgo(k),end=addDays(m,7),cur=k===0,n=inRange(t,m,end),u=t.unit?' '+esc(t.unit):'';
  if(t.period==='semana'){
    const st=cur?streak(t):0;
    return {p:Math.min(100,Math.round(n/t.goal*100)),txt:`${n}/${t.goal}${u}`+(st?`<br>racha ${st} ${st===1?'semana':'semanas'}`:'')};
  }
  if(t.period==='dia'){
    if(cur)return {p:pct(t),txt:esc(countText(t))};
    let s=0;for(let i=0;i<7;i++){const a=addDays(m,i);s+=Math.min(1,inRange(t,a,addDays(a,1))/t.goal)}
    return {p:Math.round(s/7*100),txt:`media ${(n/7).toFixed(1).replace('.',',')}/${t.goal}${u} al día`};
  }
  const cum=t.log.filter(x=>x<end).length;
  return {p:Math.min(100,Math.round(cum/Math.max(1,t.goal)*100)),txt:`${cum}/${t.goal}${u}`+(cur&&hasS(t)?` · ${esc(sLine(t).split(' · ')[0])}`:'')+`<br>+${n} ${cur?'esta':'esa'} semana`};
}

function bump(t,d){

/* ===== MOTOR DE LA RUEDA (horizontal) ===== */
const MAXA=40*Math.PI/180, SPREAD=1.4;
const STIFF=120, DAMP=2*Math.sqrt(STIFF);
const FLICK=.25, SUB=1/240;
let pages=[],pstate=[],W=1,Rw=1;
const PX=()=>Rw*MAXA;
let pos=0,vel=0,target=0,running=false,lastT=0;
const maxI=()=>gtasks().length;
const clampI=(i)=>Math.max(0,Math.min(maxI(),i));
function measure(){W=innerWidth;Rw=SPREAD*W/Math.sin(MAXA)}
function cachePages(){pages=[...pager.querySelectorAll('.page')];pstate=pages.map(()=>({vis:null,inert:null}))}
const rub=(x)=>Math.sign(x)*(1-1/(Math.abs(x)*.55/.35+1))*.35;
function draw(){
  for(let i=0;i<pages.length;i++){
    const pg=pages[i],st=pstate[i],p=i-pos,ap=Math.abs(p);
    if(ap>2.2){if(!st.far){pg.style.transform='translate3d(0,-200vh,0)';pg.style.opacity='0';st.far=true}continue}
    st.far=false;
    const a=p*MAXA,k=ap<1?ap:1;
    const x=Rw*Math.sin(a),y=Rw*(1-Math.cos(a));
    pg.style.transform=`translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,0) rotate(${a.toFixed(4)}rad) scale(${(1-.18*k).toFixed(4)})`;
    pg.style.opacity=(1-.75*k).toFixed(3);

/* inert solo se actualiza en reposo: cambiarlo a mitad de giro provoca un tirón */
function settleInert(){for(let i=0;i<pages.length;i++){const ine=i!==Math.round(pos);if(pstate[i].inert!==ine){pages[i].inert=ine;pstate[i].inert=ine}}}
/* animación por tiempo (no depende del dedo): curva ease-out suave, igual a 60 y 120 Hz */
const DUR=820;
const ease=(t)=>1-Math.pow(1-t,4);
let tw=null;
function frame(now){

    pos=tw.bump?tw.from+Math.sin(Math.PI*t)*tw.bump*(1-t*.3):tw.from+(tw.to-tw.from)*ease(t);
    if(t>=1){pos=tw.bump?tw.from:tw.to;tw=null}

  draw();
  if(!tw){draw();settleInert();running=false;pager.classList.remove('moving');posBy[curGroup()]=target;return}
  requestAnimationFrame(frame);

function run(){if(running)return;running=true;pager.classList.add('moving');requestAnimationFrame(frame)}
function step(dir){
  const to=clampI(Math.round(target)+dir);

    return;
  }

function go(i,instant){

  if(instant||matchMedia('(prefers-reduced-motion:reduce)').matches){tw=null;pos=target;vel=0;draw();settleInert();return}
  tw={from:pos,to:target,t0:performance.now(),dur:DUR};run();

/* ===== GESTOS ===== */
let down=false,mode=null,dragged=false,caught=false,sx=0,sy=0,fingerX=0,fingerY=0,dragPos0=0,track=[];
let t1=null,t2=null,held=null,longFired=false;

let menuBtn=null;
function openMenu(b){closeMenu();menuBtn=b;b.classList.add('showname');b.closest('.page').classList.add('menuon')}
function closeMenu(){if(!menuBtn)return;const pg=menuBtn.closest('.page');menuBtn.classList.remove('showname');

let lastTap=null;

function vel1(now,axis){

  const a=rec[0],b=rec[rec.length-1];return b[0]>a[0]?(b[axis]-a[axis])/(b[0]-a[0])*1000:0;

let yRaf=0;

function release(){

    const cur=parseFloat((stage.style.transform.match(/,\s*(-?[\d.]+)px/)||[])[1])||0;
    if(dy<-70||v<-500)switchView(1,cur);else if(dy>70||v>500)switchView(-1,cur);else settleY(cur);
  }else mode=null;
}
addEventListener('pointerup',release,{passive:true});
addEventListener('pointercancel',release,{passive:true});
stage.addEventListener('touchstart',()=>{},{passive:true});
stage.addEventListener('contextmenu',e=>e.preventDefault());
pager.addEventListener('click',e=>{
  const mb=e.target.closest('.menu button');
  if(mb){
    const id=mb.closest('.page').dataset.id,t=tasks.find(x=>x.id==id);if(!t)return;
    if(mb.dataset.m==='minus'){
      const r=bump(t,-1),bb=mb.getBoundingClientRect();
      if(r==='ok'){floatAt(bb.left+bb.width/2,bb.top,t,'−1'+(t.unit?' '+t.unit:''));if(navigator.vibrate)navigator.vibrate([8,30,8])}
      else{mb.classList.remove('shake');void mb.offsetWidth;mb.classList.add('shake')}
      return}
    if(mb.dataset.m==='edit'){closeMenu();open(id);return}
    if(!mb.classList.contains('arm')){mb.classList.add('arm');mb.textContent='¿Seguro?';return}
    closeMenu();removeTask(t);return;
  }
  if(dragged||caught){dragged=caught=false;return}
  const b=e.target.closest('.ringbtn');
  if(menuBtn){if(!longFired)closeMenu();longFired=false;return}
  if(!b){ /* toque fuera del anillo: derecha = siguiente, izquierda = anterior */
    if(vi>0)step(e.clientX>innerWidth/2?1:-1);return}
  if(longFired){longFired=false;return}
  const id=b.closest('.page').dataset.id;
  if(id==='new'){open(null);return}
  const t=tasks.find(x=>x.id==id);if(!t)return;
  const bb=b.getBoundingClientRect();
  const x=e.clientX||bb.left+bb.width/2,y=e.clientY||bb.top+bb.height/2,u=t.unit?' '+t.unit:'';
  const now=performance.now();
  const r=bump(t,1);
  if(r==='ok'){floatAt(x,y,t,'+1'+u);b.classList.add('pulse');setTimeout(()=>b.classList.remove('pulse'),180)}
  else if(r.startsWith&&r.startsWith('session:')){floatAt(x,y,t,r.slice(8)+' completada ✓');b.classList.add('pulse');setTimeout(()=>b.classList.remove('pulse'),180)}
  else{floatAt(x,y,t,r==='today'?'Hoy ya ✓':'Completado ✓');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}
});
summary.addEventListener('click',e=>{
  const wk=e.target.closest('.wk');
  if(wk){const k=+wk.dataset.k;selK=selK===k?0:k;renderSummary();if(navigator.vibrate)navigator.vibrate(8);return}
  if(e.target.closest('.big')&&selK){selK=0;renderSummary();
    const wr=summary.querySelector('.weeks');wr.scrollTo({left:wr.scrollWidth,behavior:'smooth'});return}
  if(dragged){dragged=false;return}
  const row=e.target.closest('.srow');if(!row)return;
  const i=[...summary.querySelectorAll('.srow')].indexOf(row);
  const ordered=groups().flatMap(g=>tasks.filter(t=>t.group===g));const t=ordered[i];if(!t)return;
  posBy[t.group]=tasks.filter(x=>x.group===t.group).indexOf(t);
  switchView(views().indexOf(t.group)-vi);
});
addEventListener('keydown',e=>{
  if($('sheet').classList.contains('on'))return;
  if(vi>0&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();step(e.key==='ArrowRight'?1:-1)}
  if(e.key==='ArrowDown'){e.preventDefault();switchView(1)}
  if(e.key==='ArrowUp'){e.preventDefault();switchView(-1)}
});

/* ===== hoja de edición ===== */
let editing=null,pick={icon:'pesa',color:COLORS[0],period:'total'};
function paintPickers(){
  $('sheet').style.setProperty('--pick',pick.color);
  $('fIcons').innerHTML=PICKABLE.map(k=>`<button type="button" data-i="${k}" class="${k===pick.icon?'sel':''}" aria-label="${k}">${svg(k)}</button>`).join('');
  $('fColors').innerHTML=COLORS.map(c=>`<button type="button" data-c="${c}" class="${c===pick.color?'sel':''}" style="--sw:${c}" aria-label="Color ${c}"></button>`).join('');
  $('fPeriod').querySelectorAll('button').forEach(b=>b.classList.toggle('sel',b.dataset.p===pick.period));
}
let pickS=[],pickCur=0;
function paintSess(){
  const d=editing&&hasS(editing)?sDone(editing):[];
  $('fSess').innerHTML=pickS.map((x,i)=>{const done=x.o!=null?(d[x.o]||0):0;
    return `<div class="sr2" data-i="${i}"><button type="button" class="act ${i===pickCur?'on':''}" data-a="act" aria-label="Sesión activa"></button>
      <input class="sn" value="${esc(x.name)}" maxlength="24" aria-label="Nombre de la sesión">
      <span class="sc">${done}/${x.n}</span>
      <button type="button" data-a="dec" aria-label="Quitar un apartado">−</button><button type="button" data-a="inc" aria-label="Añadir un apartado">+</button>
      ${done?'':'<button type="button" data-a="rm" class="rm" aria-label="Quitar sesión">×</button>'}</div>`}).join('');
  $('goalBox').hidden=pickS.length>0;
  $('sessBox').hidden=pickS.length===0;
}
$('fSess').addEventListener('input',e=>{const r=e.target.closest('.sr2');if(r&&e.target.classList.contains('sn'))pickS[+r.dataset.i].name=e.target.value});
$('fSess').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const i=+b.closest('.sr2').dataset.i,x=pickS[i];
  const d=editing&&hasS(editing)?sDone(editing):[],done=x.o!=null?(d[x.o]||0):0;
  if(b.dataset.a==='act')pickCur=i;
  if(b.dataset.a==='inc')x.n=Math.min(999,x.n+1);
  if(b.dataset.a==='dec')x.n=Math.max(done,x.n-1);
  if(b.dataset.a==='rm'){pickS.splice(i,1);if(pickCur>=pickS.length)pickCur=Math.max(0,pickS.length-1)}
  paintSess();
});
$('addSess').addEventListener('click',()=>{pickS.push({name:'Sesión '+(pickS.length+1),n:1,o:null});paintSess();
  const ins=$('fSess').querySelectorAll('.sn');const last=ins[ins.length-1];if(last){last.focus();last.select()}});
function fillCount(){$('spct').textContent=pct(editing)+'%';$('scount').textContent=countText(editing)}
$('fIcons').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b){pick.icon=b.dataset.i;paintPickers()}});
$('fColors').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(b){pick.color=b.dataset.c;paintPickers()}});
$('fPeriod').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(b){pick.period=b.dataset.p;paintPickers();if(editing)fillCount()}});
$('plus').addEventListener('click',()=>editing&&bump(editing,1));
$('minus').addEventListener('click',()=>editing&&bump(editing,-1));
function open(id){
  editing=id?tasks.find(t=>t.id==id):null;
  const g=vi>0?curGroup():groups()[0];
  const t=editing||{name:'',goal:10,unit:'',icon:'estudio',color:COLORS[tasks.length%COLORS.length],group:g,period:g==='Asignaturas'?'total':'semana',once:false};
  $('stitle').textContent=editing?editing.name:'Nueva rueda';
  $('fName').value=t.name;$('fGoal').value=t.goal;$('fUnit').value=t.unit||'';$('fGroup').value=t.group;$('fOnce').checked=!!t.once;
  $('groupList').innerHTML=groups().map(x=>`<option value="${esc(x)}">`).join('');
  pick={icon:t.icon,color:t.color,period:t.period};paintPickers();
  pickS=hasS(t)?t.sessions.map((x,i)=>({name:x.name,n:x.n,o:i})):[];pickCur=hasS(t)?Math.max(0,activeS(t)):0;paintSess();
  $('step').hidden=$('spct').hidden=$('reset').hidden=$('del').hidden=!editing;
  if(editing)fillCount();
  $('del').classList.remove('arm');$('del').textContent='Eliminar';
  $('sheet').classList.add('on');$('scrim').classList.add('on');
}
function close(){$('sheet').classList.remove('on');$('scrim').classList.remove('on');if(document.activeElement)document.activeElement.blur();editing=null}
$('scrim').addEventListener('click',close);
$('sheet').addEventListener('submit',e=>{
  e.preventDefault();
  const name=$('fName').value.trim()||'Rueda';
  const group=$('fGroup').value.trim()||'General';
  const goal=Math.max(1,Math.min(9999,parseInt($('fGoal').value,10)||1));
  const unit=$('fUnit').value.trim(),once=$('fOnce').checked;
  let t=editing;
  if(t)Object.assign(t,{name,group,goal,unit,once,icon:pick.icon,color:pick.color,period:pick.period});
  else{t={id:Date.now(),name,group,goal,unit,once,icon:pick.icon,color:pick.color,period:pick.period,log:[]};tasks.push(t)}
  if(pickS.length){
    const map={};pickS.forEach((x,i)=>{if(x.o!=null)map[x.o]=i});
    if(t.slog)t.slog=t.slog.map(i=>map[i]!=null?map[i]:0);
    t.sessions=pickS.map(x=>({name:(x.name||'').trim()||'Sesión',n:x.n}));t.cur=pickCur;t.goal=Math.max(1,sGoal(t));
    if(!t.slog)t.slog=t.log.map(()=>0);
  }else if(t.sessions){delete t.sessions;delete t.slog;delete t.cur}
  save();close();
  vi=views().indexOf(group);posBy[group]=tasks.filter(x=>x.group===group).indexOf(t);
  render();flashName();
});
$('reset').addEventListener('click',()=>{if(!editing)return;const s=periodStart(editing);if(editing.slog)editing.slog=editing.slog.filter((_,i)=>editing.log[i]<s);editing.log=editing.log.filter(x=>x<s);if(hasS(editing))editing.cur=0;save();paint(editing);close()});
$('del').addEventListener('click',()=>{
  const b=$('del');
  if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='¿Seguro? Pulsa otra vez';return}
  const t=editing;close();removeTask(t);
});

/* reloj interno: detecta el cambio de día (y de semana los lunes) y recalcula todo.
   Funciona con la app abierta a medianoche y al volver a abrirla otro día. */
let today=dayStart();
function checkDay(){
  const d=dayStart();if(d===today)return;
  today=d;lastTap=null;
  if($('sheet').classList.contains('on')||down){pendingDay=true;return}
  closeMenu();render();
}
let pendingDay=false;
function scheduleMidnight(){
  const next=addDays(dayStart(),1);
  setTimeout(()=>{checkDay();scheduleMidnight()},Math.max(1000,next-Date.now()+500));
}
scheduleMidnight();
setInterval(()=>{checkDay();if(pendingDay&&!down&&!$('sheet').classList.contains('on')){pendingDay=false;closeMenu();render()}},30000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;
  if(dayStart()!==today){checkDay();return}
  if(!$('sheet').classList.contains('on'))render()});
addEventListener('pageshow',checkDay);
addEventListener('focus',checkDay);
addEventListener('resize',()=>{measure();draw()});
measure();render();flashName();
/* funciona sin conexión una vez instalada */
if('serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{})}catch(e){}}
}
</script>
